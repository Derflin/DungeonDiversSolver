name: Deploy Dungeon Divers Solver website

on:
  push:
    branches: [release]
  workflow_dispatch:

# Build can read the repository; only the deploy job can publish to Pages.
permissions:
  contents: read

# A new release-branch push supersedes an earlier website deployment.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Also protects against manual dispatch from main or another branch.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected release commit
        uses: actions/checkout@v4

      - name: Install Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2  # Verify against the exact Godot patch version used locally.
          use-dotnet: false
          include-templates: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install README conversion dependencies
        run: python -m pip install -r web/requirements.txt

      - name: Import Godot resources
        run: godot --headless --import

      - name: Export Web - Website
        run: |
          mkdir -p builds/web-website
          godot --headless --export-release 'Web - Website' builds/web-website/index.html

      - name: Generate website documentation and copy screenshots
        env:
          GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
          REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python web/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: builds/web-website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
